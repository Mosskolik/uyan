name: Windows exe olustur

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Model dosyasini indir
        run: curl -L -o face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
      - name: Exe olustur
        run: python -m PyInstaller --onefile --name UYAN --collect-all mediapipe --collect-data cv2 uyan.py
      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paket | Out-Null
          Copy-Item dist\UYAN.exe paket\
          Copy-Item face_landmarker.task paket\
          Copy-Item README.md paket\
      - uses: actions/upload-artifact@v4
        with:
          name: UYAN-windows
          path: paket/
